# Lakeshore Travel Group: the map of the agent field.
# Every claim carries the source it came from and the date the source
# makes it true (a release date, or the access date of a living page).
# Gap codes: closes (outside the loop, a record you can read),
# partial (a hook inside the loop, or a record you must finish),
# claims (said on a page, no mechanism found), none.
# Lock-in: 1 (walk away in a week) to 5 (rebuild to leave).

map: lakeshore-agent-map
as_of: 2026-11-02
owner: Daniel Price
reviewers: [Owen Fletcher, Librarian pass]
