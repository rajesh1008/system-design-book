# Lakeshore autonomy table, January 2026 (Chapter 6).
# One row per task type. The level is a design parameter, set here and
# changed only by a named, signed event. Scores run 0 to 2:
#   reversibility  0 cannot be undone, 1 undone within a window, 2 voidable
#   value_at_risk  0 high (over $500), 1 medium, 2 low (up to $100)
#   verifiable     0 no system of record we can read, 2 one we can read
# Levels, lowest first: suggest, act_with_approval, act_and_notify,
# act_unattended. Customer states come from planes.action.CUSTOMER_STATES.

version = "autonomy-2026-01"
agent_identity = "agent-loop"

[task.refund]
policy = "refunds-v3"
policy_cap_usd = 1500.0
limit_usd = 1500.0
reversibility = 0
value_at_risk = 0
verifiable = 2
level = "act_with_approval"
handoff = "sync"
sync_wait_s = 120
promise_minutes = 60
receiver = "refund approver desk"
customer_sees = ["waiting for approval", "with a person", "in progress",
                 "done", "declined"]

[task.rebook]
policy = "rebook-v2"
policy_cap_usd = 250.0
limit_usd = 250.0
reversibility = 1
value_at_risk = 1
verifiable = 2
level = "act_and_notify"
handoff = "async"
sync_wait_s = 0
promise_minutes = 30
refuse_window_hours = 24
receiver = "agent desk queue"
customer_sees = ["with a person", "in progress", "done"]

[task.voucher]
policy = "vouchers-v1"
policy_cap_usd = 100.0
limit_usd = 100.0
daily_budget_usd = 5000.0
reversibility = 2
value_at_risk = 2
verifiable = 2
level = "act_unattended"
handoff = "async"
sync_wait_s = 0
promise_minutes = 1440
audit_sample = 0.05
receiver = "voucher audit sample"
customer_sees = ["with a person", "in progress", "done"]

[task.hotel_cancel]
policy = "hotel-cancel-v1"
policy_cap_usd = 0.0
limit_usd = 0.0
reversibility = 0
value_at_risk = 1
verifiable = 0
level = "suggest"
handoff = "async"
sync_wait_s = 0
promise_minutes = 240
receiver = "agent desk queue"
customer_sees = ["with a person", "done"]
