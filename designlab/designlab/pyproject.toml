[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "designlab"
version = "0.1.0"
description = "Reference labs for System Design for Agentic AI"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["common", "corpus", "bank", "ch01", "chain", "map", "baseline",
            "method", "planes", "effects", "spine", "durable", "capacity",
            "isolation", "failure", "models", "serving", "portfolio",
            "toolargs", "adapt", "cost", "knowledge", "retrieval", "memory",
            "gateway", "harness"]

[tool.setuptools.package-data]
common = ["models.toml", "fixtures/*.json"]
bank = ["fixtures/*.md"]
isolation = ["egress.toml"]
map = ["map.yaml"]
method = ["designs/*.toml"]
planes = ["*.toml"]
models = ["contracts/*.toml", "contracts/archive/*.toml", "fixtures/*.json",
          "fixtures/*/*.json", "golden/*.jsonl"]
serving = ["fixtures/*.json"]
portfolio = ["policy.toml", "contracts/*.toml", "fixtures/calls/*.json",
             "golden/*.json", "golden/*.jsonl"]
adapt = ["fixtures/*.json"]
knowledge = ["layer.toml", "contracts/*.toml", "fixtures/*.json"]
harness = ["releases.toml", "manifests/*.toml", "fixtures/live/*.json"]
