[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "designlab"
version = "0.1.0"
description = "Reference labs for System Design for Agentic AI"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["common", "corpus", "bank", "ch01", "chain", "map", "baseline",
            "method", "planes"]

[tool.setuptools.package-data]
common = ["models.toml", "fixtures/*.json"]
bank = ["fixtures/*.md"]
map = ["map.yaml"]
method = ["designs/*.toml"]
planes = ["*.toml"]
