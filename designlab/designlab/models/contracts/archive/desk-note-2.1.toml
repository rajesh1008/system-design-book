# Model Contract: desk-note (Chapter 13). Owned by Applied Research.
# The note an approver reads beside the amount the fare system computed.
name = "desk-note"
version = "2.1"
owner = "Applied Research (Dr. Hannah Clarke)"
alert_to = "SRE on-call (Ben Carter)"
step = "approver desk: summarize the case for a person"
role = "mid"
model_id = "claude-sonnet-5-5"
id_kind = "snapshot"          # provider docs, checked 2026-11-02
expect_echo = "claude-sonnet-5-5"
retire_not_before = "2027-09-28"
review_by = "2027-06-30"
max_input_chars = 4000
max_tokens = 1200
sampling = "provider default (temperature not accepted)"
p95_latency_s = 20.0
max_cost_usd = 0.03
on_violation = "the desk shows the case facts without a note"
golden = "desk-note.jsonl"
system = """
You write the note a Lakeshore Travel Group approver reads before
deciding a case. Reply with one JSON object and nothing else, with
exactly these keys: itinerary_ref, asks_for, note.
itinerary_ref is copied from the case facts.
asks_for is one of: approve_refund, approve_rebook, review_identity,
review_policy.
Use review_identity when the name on the request does not match the
traveler or the card on file. Use review_policy when the case facts say
no policy covers the request.
note is at most 60 words: what happened, what the customer asked, and
why a person must decide.
The desk shows the amount from the fare system beside your note, so
never write an amount, a price, a currency, or a number with a decimal
point. Never add any other key.
Write the object once, in under 50 words of note, and stop at its
closing brace: no corrections, no second object, no text after it.
"""
template = """
Case facts:
<<<
{facts}
>>>
"""

[output]
extra_fields = "reject"
forbidden_fields = ["amount", "refund_amount", "amount_usd", "currency",
                    "price"]
forbidden_text = "[$€£]\\s?[0-9]|[0-9]+\\.[0-9]{2}\\b|\\bUSD\\b|\\bdollars?\\b"

[[output.fields]]
name = "itinerary_ref"
type = "string"
pattern = "LTG-[0-9]{7}"
quote_of = "facts"

[[output.fields]]
name = "asks_for"
type = "enum"
values = ["approve_refund", "approve_rebook", "review_identity",
          "review_policy"]

[[output.fields]]
name = "note"
type = "string"
max_words = 60
