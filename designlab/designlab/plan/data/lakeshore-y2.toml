# Lakeshore's year two as a five-year plan record (DR-48.1). Commitments
# sit on the four links that stay and do not wait on a model release;
# bets are dated predictions about models, runtimes, protocols, and the
# role, each with a test, an owner, and a revisit. Lakeshore figures
# are illustrative.

[plan]
id = "lakeshore-year-two"
record = "DR-48.1"
date = "2026-11-02"
year_two_end = "2027-09-30"
horizon = "2031-09-30"
owner = "Daniel Price"
signer = "Sarah Whitfield"
reviewers = ["Rachel Morgan", "Owen Fletcher"]
changes_per_year = 2100000

[targets]
agent = 52
assisted = 20
self_service = 21
person = 7
blended_usd = 8.90

[[commitment]]
id = "C1"
link = "effect"
text = "every effect typed, limited, and undoable or gated"
measure = "kill switch stops a use case in 90 s"
owner = "Ben Carter"

[[commitment]]
id = "C2"
link = "permission"
text = "permission decided outside the model, by rule"
measure = "unauthorized actions 0; no standing privilege"
owner = "Owen Fletcher"

[[commitment]]
id = "C3"
link = "verification"
text = "a verifier reads a record the agent cannot write"
measure = "verified 99.5% or better; no queue over an hour"
owner = "Marcus Bell"

[[commitment]]
id = "C4"
link = "trail"
text = "one record per change, from request to settlement"
measure = "every refund traceable to its permission"
owner = "Rachel Morgan"

[[commitment]]
id = "C5"
link = "effect"
text = "cost per change measured on verified outcomes"
measure = "blended below $8.90 by September 30, 2027"
owner = "Sarah Whitfield"

[[bet]]
id = "B1"
area = "models"
